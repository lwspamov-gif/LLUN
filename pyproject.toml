[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-video"
version = "0.1.0"
description = "Terminal-based ASCII video converter and player"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23.0",
  "opencv-python>=4.8.0",
  "Pillow>=10.0.0",
  "pytest>=7.0.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0.0",
]

[project.scripts]
ascii-video = "ascii_video.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
